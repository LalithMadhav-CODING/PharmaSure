# Render deployment — Docker runtime
services:
  - type: web
    name: pharmasure
    runtime: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # URL of the backend serving /api/*. Empty => same-origin (all-in-one).
      # Set this to the tunnel URL when the backend runs on the local machine.
      - key: BACKEND_API_URL
        sync: false
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - Dockerfile
        - src/**
        - data/**
        - requirements.txt
